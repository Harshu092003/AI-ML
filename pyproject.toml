[tool.poetry]
name = "ai-ml"
version = "0.1.0"
description = ""
authors = ["Harshvardhan Pujari <harshvardhan_pujari@mail.mumbai-tech.com>"]
readme = "README.md"
package-mode = false


[tool.poetry.dependencies]
python = ">=3.12,<3.14.1 || >3.14.1,<3.15"
scikit-learn = ">=1.7.2,<2.0.0"
matplotlib = ">=3.10.7,<4.0.0"
pandas = ">=2.3.3,<3.0.0"
mlxtend = "^0.24.0"
networkx = "^3.6.1"
ipykernel = "^7.1.0"
chromadb = "^1.4.1"
streamlit = "^1.53.1"
langchain = "^1.2.7"
torch = "^2.10.0"
transformers = "^4.57.6"
sentence-transformers = "^5.2.0"
llama-index = "^0.14.13"
python-dotenv = "^1.2.1"
llama-index-embeddings-huggingface = "^0.6.1"
llama-index-llms-ollama = "^0.9.1"
llama-index-vector-stores-chroma = "^0.5.5"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipykernel (>=7.1.0,<8.0.0)",
    "pytest (>=9.0.2,<10.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "ruff (>=0.14.14,<0.15.0)",
]
